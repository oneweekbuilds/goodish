<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDFDFD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E9FBFC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with subtle gradient -->
  <rect width="180" height="180" fill="url(#bg)" rx="20"/>

  <!-- Outer lens circle -->
  <circle cx="90" cy="90" r="63" stroke="#01B1C0" stroke-width="8" fill="none"/>

  <!-- Inner lens circle (white) -->
  <circle cx="90" cy="90" r="38" fill="white"/>

  <!-- Data visualization bars inside lens -->
  <rect x="65" y="102" width="8" height="18" fill="#01B1C0" rx="2"/>
  <rect x="77" y="90" width="8" height="30" fill="#01B1C0" rx="2"/>
  <rect x="89" y="96" width="8" height="24" fill="#01B1C0" rx="2"/>
  <rect x="101" y="84" width="8" height="36" fill="#01B1C0" rx="2"/>
</svg>
