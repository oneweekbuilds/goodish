<svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlgorithmLens logo">
  <defs>
    <linearGradient id="algGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"></stop>
      <stop offset="50%" stop-color="#6366f1"></stop>
      <stop offset="100%" stop-color="#10b981"></stop>
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g>
    <!-- Eye outline: even taller almond, same width -->
    <path d="M80,100 Q160,20 240,100 Q160,180 80,100 Z" fill="none" stroke="url(#algGradient)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>

    <!-- Lens (pupil) - outline only -->
    <circle cx="160" cy="100" r="24" fill="none" stroke="url(#algGradient)" stroke-width="10"></circle>

    <!-- Subtle glass highlight -->
    <path d="M148,90 A16 16 0 0 1 172,90" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"></path>

    <!-- Handle: starts at lens edge, never enters circle -->
    <!-- Center (160,100), r=24, 45° perimeter point ≈ (160+17, 100+17) = (177,117) -->
    <line x1="177" y1="117" x2="210" y2="146" stroke="url(#algGradient)" stroke-width="10" stroke-linecap="round"></line>
  </g>

  <!-- WORDMARK -->
  <text x="50%" y="180" text-anchor="middle" font-family="Inter, Manrope, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="url(#algGradient)">
    AlgorithmLens
  </text>
</svg>
