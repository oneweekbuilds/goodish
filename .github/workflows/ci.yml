name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# The website lives in AlgorithmLens_Cowork, not at the repo root.
# The mobile app is a separate repo with its own remote; the copy under
# AlgorithmLens_Cowork/mobile is a stale duplicate and is not checked here.
jobs:
  lint:
    runs-on: ubuntu-latest
    # Existing lint errors are being cleaned up separately; report, do not block.
    continue-on-error: true
    defaults:
      run:
        working-directory: AlgorithmLens_Cowork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AlgorithmLens_Cowork/package-lock.json
      - run: npm ci
      - run: npm run lint:all
  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: AlgorithmLens_Cowork
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AlgorithmLens_Cowork/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
    env:
      BASE_URL: http://localhost:5173
