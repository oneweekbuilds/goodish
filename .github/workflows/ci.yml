name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:all
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
    env:
      BASE_URL: http://localhost:5173
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AlgorithmLens_Cowork/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AlgorithmLens_Cowork/mobile/package-lock.json
      - run: npm ci
      # Hard gate: mobile unit tests must pass.
      - run: npm test
      # Hard gate: the SDK 54 upgrade compiles clean as of Batch 6 (zero tsc
      # errors), so type checking is blocking, same as the tests above.
      - run: npx tsc --noEmit
