name: Diagnose BroadcastExtension

on:
  workflow_dispatch: # Manual trigger only

jobs:
  diagnose:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: AlgorithmLens_Cowork/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run prebuild
        run: npx expo prebuild --platform ios --no-install

      - name: Add BroadcastExtension via xcodeproj gem
        run: |
          echo "[xcodeproj-gem] Installing xcodeproj gem..."
          gem install xcodeproj
          echo "[xcodeproj-gem] Gem installed successfully."

          echo "[xcodeproj-gem] Running Ruby script to create BroadcastExtension target..."
          ruby <<'RUBY'
          require 'xcodeproj'
          require 'fileutils'

          PREFIX = "[xcodeproj-gem]"

          proj_path = "ios/AlgorithmLens.xcodeproj"
          puts "#{PREFIX} Opening project: #{proj_path}"
          project = Xcodeproj::Project.open(proj_path)

          # ── Locate main app target ──
          main_target = project.targets.find { |t| t.name == "AlgorithmLens" }
          abort "#{PREFIX} ERROR: Could not find main AlgorithmLens target" unless main_target
          puts "#{PREFIX} Found main target: #{main_target.name}"

          # ── Remove existing BroadcastExtension target if present (idempotent) ──
          existing = project.targets.find { |t| t.name == "BroadcastExtension" }
          if existing
            puts "#{PREFIX} Removing pre-existing BroadcastExtension target for clean rebuild..."
            existing.remove_from_project
          end

          # ── Create the app extension target ──
          puts "#{PREFIX} Creating BroadcastExtension native target..."
          ext_target = project.new_target(
            :app_extension,
            "BroadcastExtension",
            :ios,
            nil,
            nil,
            :swift
          )
          puts "#{PREFIX} Target created: #{ext_target.name} (UUID: #{ext_target.uuid})"

          # ── Copy Info.plist and entitlements into ios/BroadcastExtension/ ──
          ext_dir = "ios/BroadcastExtension"
          FileUtils.mkdir_p(ext_dir)
          puts "#{PREFIX} Created directory: #{ext_dir}"

          # Source files live in two adjacent locations under modules/broadcast/ios/:
          #   • SampleHandler / Info.plist / entitlements live in the BroadcastExtension/ subfolder
          #   • FrameProcessor and SharedContainer live one directory up (shared with main module)
          ext_src_dir    = "modules/broadcast/ios/BroadcastExtension"
          shared_src_dir = "modules/broadcast/ios"

          infoplist_src = "#{ext_src_dir}/Info.plist"
          entitlements_src = "#{ext_src_dir}/BroadcastExtension.entitlements"

          if File.exist?(infoplist_src)
            FileUtils.cp(infoplist_src, "#{ext_dir}/Info.plist")
            puts "#{PREFIX} Copied Info.plist → #{ext_dir}/Info.plist"
          else
            puts "#{PREFIX} WARNING: #{infoplist_src} not found, creating minimal Info.plist"
            File.write("#{ext_dir}/Info.plist", <<~PLIST)
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>CFBundleDisplayName</key>
                <string>BroadcastExtension</string>
                <key>CFBundleExecutable</key>
                <string>$(EXECUTABLE_NAME)</string>
                <key>CFBundleIdentifier</key>
                <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundleName</key>
                <string>$(PRODUCT_NAME)</string>
                <key>CFBundlePackageType</key>
                <string>XPC!</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>NSExtension</key>
                <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.broadcast-services-upload</string>
                  <key>NSExtensionPrincipalClass</key>
                  <string>$(PRODUCT_MODULE_NAME).SampleHandler</string>
                </dict>
              </dict>
              </plist>
            PLIST
          end

          if File.exist?(entitlements_src)
            FileUtils.cp(entitlements_src, "#{ext_dir}/BroadcastExtension.entitlements")
            puts "#{PREFIX} Copied entitlements → #{ext_dir}/BroadcastExtension.entitlements"
          else
            puts "#{PREFIX} WARNING: #{entitlements_src} not found, creating minimal entitlements"
            File.write("#{ext_dir}/BroadcastExtension.entitlements", <<~ENT)
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>com.apple.security.application-groups</key>
                <array>
                  <string>group.com.algorithmlens.app</string>
                </array>
              </dict>
              </plist>
            ENT
          end

          # ── Add Swift source files ──
          # Per-file source map: SampleHandler ships in the BroadcastExtension/
          # subfolder; FrameProcessor and SharedContainer live one directory up
          # because they're shared with the main broadcast module.
          swift_file_sources = {
            "SampleHandler.swift"   => ext_src_dir,
            "FrameProcessor.swift"  => shared_src_dir,
            "SharedContainer.swift" => shared_src_dir,
          }

          # Copy each Swift file flat into ios/BroadcastExtension/ FIRST. We then
          # add the file reference using ONLY the bare filename so that Xcode
          # resolves it against the PBXGroup's path ("BroadcastExtension"), giving
          # us ios/BroadcastExtension/<file>.swift on disk. If we instead passed the
          # source-relative path (e.g. "modules/broadcast/ios/.../X.swift") to
          # new_file, Xcode would re-root that under the group path and end up
          # looking for ios/BroadcastExtension/modules/broadcast/ios/.../X.swift —
          # the path-doubling bug we're avoiding. The standalone
          # mobile/scripts/add-broadcast-extension.rb already does this; the
          # workflow now mirrors it so the diagnostic is a faithful proxy of EAS.
          swift_file_sources.each do |filename, source_dir|
            src = "#{source_dir}/#{filename}"
            dst = "#{ext_dir}/#{filename}"
            if File.exist?(src)
              FileUtils.cp(src, dst)
              puts "#{PREFIX} Copied #{filename} -> #{dst} (from #{source_dir})"
            else
              puts "#{PREFIX} WARNING: #{src} not found"
            end
          end

          ext_group = project.main_group.new_group("BroadcastExtension", ext_dir)
          puts "#{PREFIX} Created PBX group: BroadcastExtension"

          swift_file_sources.each_key do |filename|
            dst = "#{ext_dir}/#{filename}"
            if File.exist?(dst)
              # new_file with the bare filename — Xcode resolves it relative
              # to the group's path so the on-disk path is ios/BroadcastExtension/<filename>.
              ref = ext_group.new_file(filename)
              ext_target.source_build_phase.add_file_reference(ref)
              puts "#{PREFIX} Added source file: #{filename} (resolved via group path)"
            else
              puts "#{PREFIX} WARNING: #{dst} not found — skipping"
            end
          end

          # ── Add frameworks ──
          frameworks = ["ReplayKit.framework", "Vision.framework", "UIKit.framework", "Foundation.framework"]
          frameworks.each do |fw|
            ext_target.frameworks_build_phase.add_file_reference(
              project.frameworks_group.new_file("System/Library/Frameworks/#{fw}")
            )
            puts "#{PREFIX} Linked framework: #{fw}"
          end

          # ── Build settings ──
          puts "#{PREFIX} Configuring build settings..."
          ext_target.build_configurations.each do |config|
            config.build_settings["SWIFT_VERSION"] = "5.0"
            config.build_settings["TARGETED_DEVICE_FAMILY"] = "1,2"
            config.build_settings["INFOPLIST_FILE"] = "BroadcastExtension/Info.plist"
            config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "BroadcastExtension/BroadcastExtension.entitlements"
            config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = "com.algorithmlens.app.BroadcastExtension"
            config.build_settings["PRODUCT_NAME"] = "BroadcastExtension"
            config.build_settings["SKIP_INSTALL"] = "YES"
            config.build_settings["GENERATE_INFOPLIST_FILE"] = "NO"
            puts "#{PREFIX}   Configured: #{config.name}"
          end

          # ── Add as dependency of main app target ──
          # Workaround: expo prebuild emits PBXTargetDependency entries for the Pods
          # project whose target= is nil until `pod install` runs and resolves them.
          # xcodeproj's add_dependency walks main_target.dependencies looking for an
          # existing match by UUID and crashes on the nil. Drop unresolved entries first.
          main_target.dependencies.reject! { |dep| dep.target.nil? }
          main_target.add_dependency(ext_target)
          puts "#{PREFIX} Added BroadcastExtension as dependency of #{main_target.name}"

          # ── Add embed extension build phase ──
          embed_phase = main_target.new_copy_files_build_phase("Embed App Extensions")
          embed_phase.dst_subfolder_spec = "13" # PlugIns folder
          embed_phase.add_file_reference(ext_target.product_reference)
          puts "#{PREFIX} Added 'Embed App Extensions' copy phase to main target"

          # ── Save ──
          project.save
          puts "#{PREFIX} Project saved successfully!"

          # ── Summary ──
          puts ""
          puts "#{PREFIX} ============================================"
          puts "#{PREFIX} SUMMARY"
          puts "#{PREFIX} ============================================"
          puts "#{PREFIX} Targets in project:"
          project.targets.each { |t| puts "#{PREFIX}   - #{t.name} (#{t.product_type})" }
          puts "#{PREFIX} BroadcastExtension source files: #{ext_target.source_build_phase.files.map { |f| f.display_name }}"
          puts "#{PREFIX} BroadcastExtension frameworks: #{ext_target.frameworks_build_phase.files.map { |f| f.display_name }}"
          puts "#{PREFIX} Done!"
          RUBY

      - name: Diagnose BroadcastExtension in pbxproj
        run: |
          PBXPROJ="ios/AlgorithmLens.xcodeproj/project.pbxproj"
          
          echo "========================================="
          echo "1. CHECK: Does BroadcastExtension target exist?"
          echo "========================================="
          grep -A 20 'name = BroadcastExtension' "$PBXPROJ" | grep -A 20 'PBXNativeTarget' || echo "NOT FOUND"
          
          echo ""
          echo "========================================="
          echo "2. CHECK: PBXSourcesBuildPhase for BroadcastExtension"
          echo "========================================="
          # Find all PBXSourcesBuildPhase entries
          echo "All PBXSourcesBuildPhase entries:"
          sed -n '/Begin PBXSourcesBuildPhase/,/End PBXSourcesBuildPhase/p' "$PBXPROJ"
          
          echo ""
          echo "========================================="
          echo "3. CHECK: PBXBuildFile entries for Swift files"
          echo "========================================="
          grep -i "SampleHandler\|FrameProcessor\|SharedContainer" "$PBXPROJ" || echo "NO SWIFT FILE REFERENCES FOUND"
          
          echo ""
          echo "========================================="
          echo "4. CHECK: PBXFileReference for Swift files"
          echo "========================================="
          grep "\.swift" "$PBXPROJ" | grep -i "sample\|frame\|shared" || echo "NO SWIFT FILE REFERENCES"
          
          echo ""
          echo "========================================="
          echo "5. CHECK: BroadcastExtension build settings"
          echo "========================================="
          # Dump build settings for the extension
          grep -A 5 "SWIFT_VERSION" "$PBXPROJ" | head -30
          
          echo ""
          echo "========================================="
          echo "6. CHECK: All targets and their buildPhases"
          echo "========================================="
          python3 -c "
          import re
          
          with open('$PBXPROJ', 'r') as f:
              content = f.read()
          
          # Find PBXNativeTarget section
          target_section = re.search(r'/\* Begin PBXNativeTarget section \*/(.*?)/\* End PBXNativeTarget section \*/', content, re.DOTALL)
          if target_section:
              section = target_section.group(1)
              # Find each target
              targets = re.finditer(r'(\w+)\s*/\*\s*(.*?)\s*\*/\s*=\s*\{(.*?)\};', section, re.DOTALL)
              for t in targets:
                  uuid = t.group(1)
                  name = t.group(2)
                  body = t.group(3)
                  print(f'\nTarget: {name} (UUID: {uuid})')
                  # Extract buildPhases
                  phases = re.search(r'buildPhases\s*=\s*\((.*?)\)', body, re.DOTALL)
                  if phases:
                      phase_list = phases.group(1).strip()
                      if phase_list:
                          print(f'  buildPhases: {phase_list}')
                      else:
                          print('  buildPhases: EMPTY!')
                  else:
                      print('  buildPhases: NOT FOUND')
          "
          
          echo ""
          echo "========================================="
          echo "7. CHECK: xcodebuild target list"
          echo "========================================="
          cd ios && xcodebuild -list -project AlgorithmLens.xcodeproj 2>&1 | head -30
          
          echo ""
          echo "========================================="
          echo "8. CHECK: xcodebuild build settings for BroadcastExtension"
          echo "========================================="
          cd ios && xcodebuild -showBuildSettings -target BroadcastExtension -project AlgorithmLens.xcodeproj 2>&1 | grep -E "SWIFT_VERSION|PRODUCT_NAME|INFOPLIST_FILE|ARCHS|PRODUCT_BUNDLE_IDENTIFIER|SWIFT_COMPILATION_MODE" || echo "COULD NOT GET BUILD SETTINGS"

      - name: Verify Swift files in ios/BroadcastExtension
        run: |
          echo "=== SampleHandler.swift ===" && head -20 ios/BroadcastExtension/SampleHandler.swift
          echo "=== FrameProcessor.swift ===" && head -20 ios/BroadcastExtension/FrameProcessor.swift
          echo "=== SharedContainer.swift ===" && head -20 ios/BroadcastExtension/SharedContainer.swift

      - name: Try building BroadcastExtension target only
        run: |
          cd ios
          pod install --repo-update 2>&1 | tail -20
          echo ""
          echo "========================================="
          echo "Attempting to build BroadcastExtension target..."
          echo "========================================="
          # `pipefail` propagates xcodebuild's exit code through the `tee | tail`
          # pipeline so a real compile failure surfaces as a non-zero step exit.
          # `tee` keeps the full log on disk (uploaded as an artifact below) so
          # the grep can scan all of it, not just the last 100 lines.
          set -o pipefail
          xcodebuild build \
            -project AlgorithmLens.xcodeproj \
            -target BroadcastExtension \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/xcodebuild-broadcast.log | tail -100
          # Defence in depth: even if xcodebuild exits 0, require a literal
          # "BUILD SUCCEEDED" in the log before we trust the run.
          if ! grep -q "BUILD SUCCEEDED" /tmp/xcodebuild-broadcast.log; then
            echo "::error::xcodebuild did not emit BUILD SUCCEEDED — see uploaded log artifact for details"
            exit 1
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-broadcast-log
          path: /tmp/xcodebuild-broadcast.log

      - name: Upload pbxproj for inspection
        uses: actions/upload-artifact@v4
        with:
          name: pbxproj-dump
          path: mobile/ios/AlgorithmLens.xcodeproj/project.pbxproj
