:root{--blue:#1868D8;--green:#20A888;--ink:#3A3730;--dark:#1A1712;--paper:#F5F4F0;--card:#FFFFFF;--line:#DDD8CD;--muted:#6D685F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;width:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;border-bottom:1px solid var(--line)}
header a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink)}
.brand{width:188px;max-width:52vw}
.brand svg{width:100%;height:auto;display:block}
main{flex:1;display:grid;place-items:center;padding:64px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:520px;box-shadow:4px 6px 0 rgba(58,55,48,.08)}
.ring{width:64px;height:64px;border:1.5px solid var(--line);border-radius:50%;margin:0 0 20px;display:grid;place-items:center;font:italic 22px Source,Georgia,serif;color:var(--muted)}
h1{font:400 clamp(34px,5vw,48px)/1.05 Source,Georgia,serif;letter-spacing:-1.2px;margin:0 0 12px}
p{margin:0 0 20px;color:var(--muted)}
.limit{font:italic 18px/1.4 Source,Georgia,serif}
.button{display:inline-flex;align-items:center;justify-content:center;background:var(--dark);color:var(--paper);border-radius:14px;min-height:52px;padding:0 24px;font:600 16px/1 system-ui,sans-serif;text-decoration:none;margin-right:12px}
.secondary{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
footer{border-top:1px solid var(--line);padding:24px 0;font-size:14px;color:var(--muted)}
footer nav{display:flex;gap:20px;flex-wrap:wrap}
footer a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink)}
</style>
</head>
