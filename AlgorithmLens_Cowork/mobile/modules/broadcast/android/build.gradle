/**
 * Build configuration for the AlgorithmLens Broadcast module (Android).
 *
 * Dependencies:
 * - Google ML Kit Text Recognition for on-device OCR
 * - AndroidX Core for foreground service support
 * - Kotlin coroutines for async frame processing
 */

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

group = 'com.algorithmlens.broadcast'
version = '1.0.0'

android {
    namespace "com.algorithmlens.broadcast"
    compileSdkVersion safeExtGet("compileSdkVersion", 34)

    defaultConfig {
        minSdkVersion safeExtGet("minSdkVersion", 24)
        targetSdkVersion safeExtGet("targetSdkVersion", 34)
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(':expo-modules-core')

    // ML Kit for on-device OCR (text recognition)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // AndroidX core for foreground service
    implementation 'androidx.core:core-ktx:1.12.0'

    // Kotlin coroutines for async processing
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

// Safe extension property getter (from Expo convention)
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
