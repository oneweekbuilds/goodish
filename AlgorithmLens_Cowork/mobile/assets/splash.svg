<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 2778" width="1284" height="2778">
  <defs>
    <linearGradient id="splashBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F8FC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="iconBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="splashLensGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DBEAFE" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Full background -->
  <rect width="1284" height="2778" fill="url(#splashBgGrad)"/>

  <!-- Centered icon -->
  <g transform="translate(642, 1260)">
    <!-- Icon background (rounded square) -->
    <rect x="-120" y="-120" width="240" height="240" rx="52" ry="52" fill="url(#iconBgGrad)"/>

    <!-- Subtle glow -->
    <circle cx="0" cy="-8" r="82" fill="#3B82F6" opacity="0.3"/>

    <!-- Outer lens ring -->
    <circle cx="0" cy="-8" r="62" fill="none" stroke="url(#splashLensGrad)" stroke-width="10" opacity="0.9"/>

    <!-- Inner lens body -->
    <circle cx="0" cy="-8" r="48" fill="url(#splashLensGrad)" opacity="0.15"/>

    <!-- Prism refraction lines -->
    <rect x="-29" y="-22" width="2" height="28" rx="1" fill="#FFFFFF" opacity="0.7" transform="rotate(-20, 0, -8)"/>
    <rect x="-1" y="-27" width="2" height="38" rx="1" fill="#FFFFFF" opacity="0.9"/>
    <rect x="27" y="-22" width="2" height="28" rx="1" fill="#FFFFFF" opacity="0.7" transform="rotate(20, 0, -8)"/>

    <!-- Lens highlight -->
    <ellipse cx="-17" cy="-25" rx="14" ry="7" fill="#FFFFFF" opacity="0.2" transform="rotate(-30, -17, -25)"/>

    <!-- Data point dots -->
    <circle cx="-20" cy="2" r="2.4" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="0" cy="12" r="2.8" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="20" cy="2" r="2.4" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- App name text -->
  <text x="642" y="1460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#1E293B" letter-spacing="-0.5">AlgorithmLens</text>

  <!-- Tagline -->
  <text x="642" y="1510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#64748B">See what's really in your feed</text>
</svg>